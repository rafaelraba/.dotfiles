# AeroSpace owns window management: layouts, focus/move, resize, workspaces, and monitor movement.
# Hammerspoon is intentionally kept out of these shortcuts to avoid global hotkey conflicts.

config-version = 2
start-at-login = true

after-startup-command = []

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 30
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
exec-on-workspace-change = ['/bin/bash', '-c', '/opt/homebrew/bin/sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE="$AEROSPACE_FOCUSED_WORKSPACE"; sleep 0.2; "$HOME/.dotfiles/scripts/wm/restore-visible-window-frames.sh"']
automatically-unhide-macos-hidden-apps = false

persistent-workspaces = ['1', '2', '3', '4', '5', '6', '7', '8']

[workspace-to-monitor-force-assignment]
    1 = 1
    2 = 1
    3 = 1
    4 = 1
    5 = 2
    6 = 2
    7 = 2
    8 = 2

[key-mapping]
    preset = 'qwerty'

[gaps]
    inner.horizontal = 8
    inner.vertical = 8
    outer.left = 8
    outer.bottom = 8
    outer.top = 8
    outer.right = 8

[mode.main.binding]
    # Layouts
    cmd-alt-slash = 'exec-and-forget /bin/zsh -lc "$HOME/.dotfiles/scripts/wm/tile-focused-workspace.sh horizontal"'
    cmd-alt-shift-slash = 'exec-and-forget /bin/zsh -lc "$HOME/.dotfiles/scripts/wm/tile-focused-workspace.sh vertical"'
    cmd-alt-s = 'exec-and-forget /bin/zsh -lc "$HOME/.dotfiles/scripts/wm/stack-right-focused-workspace.sh"'
    cmd-alt-comma = 'layout accordion horizontal vertical'

    # Focus
    cmd-alt-h = 'exec-and-forget /bin/zsh -lc "$HOME/.dotfiles/scripts/wm/focus-window-direction.sh left"'
    cmd-alt-j = 'exec-and-forget /bin/zsh -lc "$HOME/.dotfiles/scripts/wm/focus-window-direction.sh down"'
    cmd-alt-k = 'exec-and-forget /bin/zsh -lc "$HOME/.dotfiles/scripts/wm/focus-window-direction.sh up"'
    cmd-alt-l = 'exec-and-forget /bin/zsh -lc "$HOME/.dotfiles/scripts/wm/focus-window-direction.sh right"'

    # Move windows inside the workspace tree
    cmd-alt-shift-h = 'move left'
    cmd-alt-shift-j = 'move down'
    cmd-alt-shift-k = 'move up'
    cmd-alt-shift-l = 'move right'

    # Single-window floating resize delegated to a small Hammerspoon CLI helper.
    # AeroSpace resize works on tiling splits; this handles explicit width + height geometry.
    cmd-alt-minus = ['layout floating', 'exec-and-forget /bin/zsh -lc "$HOME/.dotfiles/scripts/wm/center-focused-window.sh 0.50 0.75"']
    cmd-alt-equal = ['layout floating', 'exec-and-forget /bin/zsh -lc "$HOME/.dotfiles/scripts/wm/center-focused-window.sh 0.66 0.85"']

    # Floating window actions delegated to small Hammerspoon CLI helpers.
    # AeroSpace owns tiling; helpers own explicit floating placement.
    cmd-alt-m = ['layout floating', 'exec-and-forget /bin/zsh -lc "$HOME/.dotfiles/scripts/wm/center-focused-window.sh 0.78 0.90"']
    cmd-alt-f = ['layout floating', 'exec-and-forget /bin/zsh -lc "$HOME/.dotfiles/scripts/wm/maximize-focused-window.sh"']

    # Workspaces
    cmd-alt-1 = 'workspace 1'
    cmd-alt-2 = 'workspace 2'
    cmd-alt-3 = 'workspace 3'
    cmd-alt-4 = 'workspace 4'
    cmd-alt-5 = 'workspace 5'
    cmd-alt-6 = 'workspace 6'
    cmd-alt-7 = 'workspace 7'
    cmd-alt-8 = 'workspace 8'

    # Move focused window to workspace
    cmd-alt-shift-1 = 'exec-and-forget /bin/zsh -lc "$HOME/.dotfiles/scripts/wm/move-focused-window-to-workspace.sh 1"'
    cmd-alt-shift-2 = 'exec-and-forget /bin/zsh -lc "$HOME/.dotfiles/scripts/wm/move-focused-window-to-workspace.sh 2"'
    cmd-alt-shift-3 = 'exec-and-forget /bin/zsh -lc "$HOME/.dotfiles/scripts/wm/move-focused-window-to-workspace.sh 3"'
    cmd-alt-shift-4 = 'exec-and-forget /bin/zsh -lc "$HOME/.dotfiles/scripts/wm/move-focused-window-to-workspace.sh 4"'
    cmd-alt-shift-5 = 'exec-and-forget /bin/zsh -lc "$HOME/.dotfiles/scripts/wm/move-focused-window-to-workspace.sh 5"'
    cmd-alt-shift-6 = 'exec-and-forget /bin/zsh -lc "$HOME/.dotfiles/scripts/wm/move-focused-window-to-workspace.sh 6"'
    cmd-alt-shift-7 = 'exec-and-forget /bin/zsh -lc "$HOME/.dotfiles/scripts/wm/move-focused-window-to-workspace.sh 7"'
    cmd-alt-shift-8 = 'exec-and-forget /bin/zsh -lc "$HOME/.dotfiles/scripts/wm/move-focused-window-to-workspace.sh 8"'

    cmd-alt-tab = 'workspace-back-and-forth'
    cmd-alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

    # Monitor focus
    ctrl-alt-cmd-h = 'focus-monitor --wrap-around left'
    ctrl-alt-cmd-l = 'focus-monitor --wrap-around right'

    # Move focused window to monitor and keep floating frames inside the target screen.
    ctrl-alt-cmd-shift-h = 'exec-and-forget /bin/zsh -lc "$HOME/.dotfiles/scripts/wm/move-focused-window-to-monitor.sh left"'
    ctrl-alt-cmd-shift-l = 'exec-and-forget /bin/zsh -lc "$HOME/.dotfiles/scripts/wm/move-focused-window-to-monitor.sh right"'

    # Service mode
    cmd-alt-shift-semicolon = 'mode service'

[mode.service.binding]
    esc = ['reload-config', 'mode main']
    r = ['flatten-workspace-tree', 'mode main']
    b = ['balance-sizes', 'mode main']
    f = ['layout floating tiling', 'mode main']
    backspace = ['close-all-windows-but-current', 'mode main']

    minus = ['resize smart -50', 'mode main']
    equal = ['resize smart +50', 'mode main']

    cmd-alt-shift-h = ['join-with left', 'mode main']
    cmd-alt-shift-j = ['join-with down', 'mode main']
    cmd-alt-shift-k = ['join-with up', 'mode main']
    cmd-alt-shift-l = ['join-with right', 'mode main']
