git:
  pagers:
    - colorArg: always
      pager: delta --dark --features lazygit-gruvbox --paging=never
  parseEmoji: true
gui:
  border: bold
  mainPanelSplitMode: flexible
  sidePanelWidth: 0.28
  expandFocusedSidePanel: true
  enlargedSideViewLocation: left
  showFileTree: true
  showRandomTip: false
  showCommandLog: false
  showBottomLine: false
  showPanelJumps: true
  nerdFontsVersion: "3"
  authorColors:
    "*": "default"
  branchColors:
    "main": "red"
    "master": "red"
    "develop": "green"
    "dev": "green"
  spinner:
    frames:
      - "⠋"
      - "⠙"
      - "⠹"
      - "⠸"
      - "⠼"
      - "⠴"
      - "⠦"
      - "⠧"
      - "⠇"
      - "⠏"
    rate: 80
  theme:
    activeBorderColor:
      - '#fabd2f'
      - bold
    inactiveBorderColor:
      - '#665c54'
    optionsTextColor:
      - '#83a598'
    selectedLineBgColor:
      - '#3c3836'
    inactiveViewSelectedLineBgColor:
      - '#282828'
    cherryPickedCommitBgColor:
      - '#504945'
    cherryPickedCommitFgColor:
      - '#b8bb26'
    markedBaseCommitBgColor:
      - '#504945'
    markedBaseCommitFgColor:
      - '#fabd2f'
    unstagedChangesColor:
      - '#fb4934'
    defaultFgColor:
      - '#ebdbb2'
    searchingActiveBorderColor:
      - '#fabd2f'
      - bold
