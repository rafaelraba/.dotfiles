<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JSON Crack Viewer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1e1e2e; color: #cdd6f4; font-family: sans-serif; }
  iframe { width: 100vw; height: 100vh; border: none; }
  #fallback {
    display: none; padding: 40px; text-align: center;
  }
  #fallback a {
    color: #89b4fa; text-decoration: underline; font-size: 16px;
  }
  #fallback button {
    margin-top: 16px; padding: 10px 24px; background: #313244;
    color: #cdd6f4; border: 1px solid #585b70; border-radius: 6px;
    cursor: pointer; font-size: 14px;
  }
  #fallback button:hover { background: #45475a; }
  #status {
    position: fixed; bottom: 8px; right: 12px;
    font-size: 11px; color: #585b70;
  }
</style>
</head>
<body>
<iframe id="frame" src="http://localhost:9999/widget"></iframe>
<div id="fallback">
  <p>Could not load JSON Crack widget.</p>
  <p><a href="http://localhost:9999/editor" target="_blank">Open JSON Crack in a new tab</a></p>
  <button id="copy-btn">Copy JSON to clipboard</button>
</div>
<div id="status">loading widget...</div>
<script>
(function () {
  var frame = document.getElementById("frame");
  var fallback = document.getElementById("fallback");
  var statusEl = document.getElementById("status");
  var copyBtn = document.getElementById("copy-btn");
  var ready = false;
  var lastRaw = "";
  var currentJson = "";

  var timeout = setTimeout(function () {
    if (!ready) {
      frame.style.display = "none";
      fallback.style.display = "block";
      statusEl.textContent = "widget timeout — el container puede estar iniciando";
    }
  }, 15000);

  window.addEventListener("message", function (e) {
    if (e.origin.includes("localhost")) {
      ready = true;
      clearTimeout(timeout);
      statusEl.textContent = "widget ready";
      if (currentJson) sendJson(currentJson);
    }
  });

  frame.addEventListener("load", function () {
    ready = true;
    clearTimeout(timeout);
    statusEl.textContent = "widget loaded";
    if (currentJson) sendJson(currentJson);
  });

  function sendJson(raw) {
    try {
      JSON.parse(raw);
      frame.contentWindow.postMessage(
        { json: raw, options: { theme: "dark" } },
        "*"
      );
      statusEl.textContent = "updated " + new Date().toLocaleTimeString();
    } catch (e) {
      statusEl.textContent = "parse error";
    }
  }

  function poll() {
    fetch("/data.json?t=" + Date.now())
      .then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.text();
      })
      .then(function (text) {
        currentJson = text;
        if (text === lastRaw) return;
        lastRaw = text;
        if (ready) sendJson(text);
      })
      .catch(function () { statusEl.textContent = "fetch error"; });
  }

  copyBtn.addEventListener("click", function () {
    navigator.clipboard.writeText(currentJson).then(function () {
      copyBtn.textContent = "Copied!";
      setTimeout(function () { copyBtn.textContent = "Copy JSON to clipboard"; }, 2000);
    });
  });

  setInterval(poll, 500);
  poll();
})();
</script>
</body>
</html>
