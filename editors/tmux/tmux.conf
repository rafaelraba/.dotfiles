# Carga TPM
set -g @plugin 'tmux-plugins/tpm'

# Tested options for TMUX compatibility
set -g @plugin 'tmux-plugins/tmux-sensible'

# Clipboard management
set -g @plugin 'tmux-plugins/tmux-yank'

# Navegar entre paneles con prefix + hjkl
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Tmux Resurrect
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Which Key
set -g @plugin 'alexwforsythe/tmux-which-key'

# Floating window (F12)
bind-key -n F12 if-shell -F '#{==:#{session_name},_scratch}' {
  detach-client
} {
  display-popup -d "#{pane_current_path}" -w 80% -h 80% -E "tmux new-session -A -s _scratch"
}

# Terminal flotante persistente (Ctrl+a p)
bind p if-shell -F '#{==:#{session_name},_popup}' {
  detach-client
} {
  display-popup -d "#{pane_current_path}" -w 80% -h 80% -E "tmux new-session -A -s _popup"
}

# Crear nueva sesión (Ctrl+a S) — en popup: cierra el popup
bind S if-shell -F '#{m:_*,#{session_name}}' {
  detach-client
} {
  if-shell 'tmux has-session -t "#{b:pane_current_path}" 2>/dev/null' \
    'command-prompt -p "Ya existe \"#{b:pane_current_path}\". Nombre:" "new-session -s \"%1\" -c \"#{pane_current_path}\""' \
    'new-session -s "#{b:pane_current_path}" -c "#{pane_current_path}"'
}

# Al eliminar sesión, saltar a otra en vez de salir de tmux
set -g detach-on-destroy off

# Sesiones flotantes (_*): detach al morir para cerrar el popup limpiamente
set-hook -g session-created 'if-shell -F "#{m:_*,#{session_name}}" "set-option detach-on-destroy on"'

# Eliminar sesión (Ctrl+a X) — en popup: cierra el popup
bind X if-shell -F '#{m:_*,#{session_name}}' {
  detach-client
} {
  confirm-before -p "Eliminar sesión '#{session_name}'? (y/n)" "run-shell '~/.dotfiles/scripts/tmux-kill-session.sh \"#{session_name}\"'"
}

# Listar sesiones excluyendo las flotantes (prefijo _) — en popup: cierra el popup
bind s if-shell -F '#{m:_*,#{session_name}}' {
  detach-client
} {
  display-popup -w 60% -h 50% -E "\
    tmux list-sessions -f '#{?#{m:_*,#{session_name}},0,1}' \
      -F '#{session_name}|#{session_windows} win|#{pane_current_path}' \
    | column -t -s '|' \
    | fzf --reverse --border=rounded --header='Sesiones' --no-info --prompt='  ' \
    | awk '{print \$1}' \
    | xargs tmux switch-client -t"
}

# Tema Kanagawa
set -g @plugin 'Nybkox/tmux-kanagawa'
set -g @kanagawa-theme 'Kanagawa'
set -g @kanagawa-plugins "git cpu-usage ram-usage"
set -g @kanagawa-ignore-window-colors true

# --- terminal & key handling ---
set -g default-terminal "xterm-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

set -s extended-keys off

# Modo vim
set -g mode-keys vi
if-shell 'uname | grep -q Darwin' \
  'bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"' \
  'bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "clip"'

# Keymaps
unbind C-b
set -g prefix C-a
bind C-a send-prefix

unbind %
unbind '"'
bind v split-window -h -c "#{pane_current_path}"
bind d split-window -v -c "#{pane_current_path}"

# Mouse support
set -g mouse on

# Status bar (oculta por defecto, Ctrl+a b para toggle)
set -g status off
bind b set -g status

# Kill all sessions except current
bind K confirm-before -p "Kill all other sessions? (y/n)" "kill-session -a"

# Fix index
set -g base-index 1
setw -g pane-base-index 1

# TPM init
run '~/.tmux/plugins/tpm/tpm'
