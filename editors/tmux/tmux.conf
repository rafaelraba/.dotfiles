# Carga TPM
set -g @plugin 'tmux-plugins/tpm'

# Tested options for TMUX compatibility
set -g @plugin 'tmux-plugins/tmux-sensible'

# Clipboard management
set -g @plugin 'tmux-plugins/tmux-yank'

# Navegar entre paneles con prefix + hjkl
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Tmux Resurrect
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Floating window (F12)
bind-key -n F12 if-shell -F '#{==:#{session_name},_scratch}' {
  detach-client
} {
  display-popup -d "#{pane_current_path}" -w 80% -h 80% -E "tmux new-session -A -s _scratch"
}

# Terminal flotante persistente (Ctrl+a p)
bind p if-shell -F '#{==:#{session_name},_popup}' {
  detach-client
} {
  display-popup -d "#{pane_current_path}" -w 80% -h 80% -E "tmux new-session -A -s _popup"
}

# Panel inferior persistente para procesos de desarrollo (Ctrl+a Enter)
# Alt+Enter queda libre para salto de línea en chats/terminal apps.
unbind-key -n M-Enter
bind Enter if-shell -F '#{==:#{session_name},_runner}' {
  detach-client
} {
  run-shell '~/.dotfiles/scripts/tmux-runner-panel.sh "#{pane_current_path}"'
}

# Crear nueva sesión (Ctrl+a S) — en popup: cierra el popup
bind S if-shell -F '#{m:_*,#{session_name}}' {
  detach-client
} {
  if-shell '~/.dotfiles/scripts/tmux-new-session.sh "#{pane_current_path}"' {} {
    display-popup -d "#{pane_current_path}" -w 62 -h 9 -b rounded -s "bg=#1d2021,fg=#d4be98" -S "fg=#d79921" -T " new workspace " -e "TMUX_NEW_SESSION_PANE_PATH=#{pane_current_path}" -E '~/.dotfiles/scripts/tmux-new-session-popup.sh'
  }
}

# Al eliminar sesión, saltar a otra en vez de salir de tmux
set -g detach-on-destroy off

# Sesiones flotantes (_*): detach al morir para cerrar el popup limpiamente
set-hook -g session-created 'if-shell -F "#{m:_*,#{session_name}}" "set-option detach-on-destroy on"'

# Eliminar sesión (Ctrl+a X) — en popup: cierra el popup
bind X if-shell -F '#{m:_*,#{session_name}}' {
  detach-client
} {
  confirm-before -p "Eliminar sesión '#{session_name}'? (y/n)" "run-shell '~/.dotfiles/scripts/tmux-kill-session.sh \"#{session_name}\"'"
}

# Navegar entre sesiones normales con H / L (ignora flotantes _*)
bind H if-shell -F '#{m:_*,#{session_name}}' { detach-client } { run-shell '~/.dotfiles/scripts/tmux-switch-session.sh prev' }
bind L if-shell -F '#{m:_*,#{session_name}}' { detach-client } { run-shell '~/.dotfiles/scripts/tmux-switch-session.sh next' }

# Navegar entre sesiones normales con Alt/Option + izquierda/derecha
bind-key -n M-Left run-shell '~/.dotfiles/scripts/tmux-switch-session.sh prev'
bind-key -n M-Right run-shell '~/.dotfiles/scripts/tmux-switch-session.sh next'

# Selector de sesiones — en popup: cierra el popup
# Usa wrapper que captura el estado de sesiones ANTES del display-popup
# para evitar inconsistencias en tmux ≥3.6
bind s if-shell -F '#{m:_*,#{session_name}}' {
  detach-client
} {
  run-shell -t = "~/.dotfiles/scripts/session-picker-wrapper.sh '#S' '#{pane_current_path}' '#{client_width}'"
}

# ── Custom Status Bar ──
# Requiere una Nerd Font para los íconos.

set -g status-position top
# El centro queda reservado para la herramienta de la ventana activa.
set -g status-justify absolute-centre
set -g status-style "bg=#0b0f1a,fg=#a9b1d6"
set -g status-interval 5

# Left: sesión actual, hasta dos sesiones recientes y desborde
set -g status-left-length 94
set -g status-left "#(~/.dotfiles/scripts/status-sessions.sh #S) "

# Right: directorio actual, estilo pill
set -g status-right-length 80
set -g status-right "#[bg=#f5bde6,fg=#101320,bold] 󰉋 #[bg=#1a1f33,fg=#cad3f5,bold] #{b:pane_current_path} "

# Center: solo la herramienta activa, para preservar un foco visual claro.
set -g automatic-rename-format '#{?#{m/r:^[0-9]+\.[0-9]+\.[0-9]+$,#{pane_current_command}},claude,#{pane_current_command}}'
setw -g window-status-separator ""
setw -g window-status-format ""
setw -g window-status-current-format "#[bg=#0b0f1a,fg=#363a4f]#[bg=#363a4f,fg=#cad3f5,bold] #W #[bg=#0b0f1a,fg=#363a4f]"

# Pane border
set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#7aa2f7"

# Message / prompt
set -g message-style "bg=#7aa2f7,fg=#1a1b26,bold"

# --- terminal & key handling ---
set -g default-terminal "xterm-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

set -g extended-keys on
set -g extended-keys-format csi-u

# Modo vim
set -g mode-keys vi
if-shell 'uname | grep -q Darwin' \
  'bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"' \
  'bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "clip"'

# Keymaps
unbind C-b
set -g prefix C-a
bind C-a send-prefix

unbind %
unbind '"'
bind v split-window -h -c "#{pane_current_path}"
bind d split-window -v -c "#{pane_current_path}"

# Mouse support
set -g mouse on

# Status bar arriba por defecto, con pestañas de sesiones/proyecto
set -g status on
bind b set -g status

# Kill all sessions except current
bind K confirm-before -p "Kill all other sessions? (y/n)" "kill-session -a"

# Fix index
set -g base-index 1
setw -g pane-base-index 1

# TPM init
run '~/.tmux/plugins/tpm/tpm'
