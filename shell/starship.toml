format = """\
[🌴](bold fg:rosewater) \
$directory\
$git_branch\
$git_status\
$fill\
$nodejs\
$rust\
$golang\
$php\
$bun\
$java\
$c\
$conda\
$zig\
$cmd_duration\
$time
$character"""

add_newline = true
command_timeout = 3600000
scan_timeout = 50
palette = "gentleman"

[fill]
symbol = ' '

[palettes.gentleman]
text = "#F3F6F9"
red = "#CB7C94"
green = "#B7CC85"
yellow = "#FFE066"
blue = "#7FB4CA"
mauve = "#A3B5D6"
pink = "#FF8DD7"
teal = "#7AA89F"
peach = "#DEBA87"
subtext0 = "#5C6170"
overlay0 = "#232A40"
rosewater = "#E0C15A"
flamingo = "#FF8DD7"
maroon = "#C4746E"
lavender = "#B99BF2"
subtext1 = "#8A8FA3"
overlay2 = "#313342"
overlay1 = "#191E28"
surface2 = "#27345C"
surface1 = "#232A40"
surface0 = "#191E28"
base = "none"
mantle = "#06080f"
crust = "#06080f"

[character]
success_symbol = "[→](bold fg:green) "
error_symbol = "[λ](bold fg:red) "
vimcmd_symbol = "[N](bold red) "
vimcmd_replace_one_symbol = "[R](bold peach) "
vimcmd_visual_symbol = "[V](bold mauve) "

[directory]
format = "[$path](bold fg:rosewater)[$read_only]($read_only_style) "
truncation_length = 8
fish_style_pwd_dir_length = 1
style = "fg:rosewater"
read_only_style = "fg:rosewater"
before_repo_root_style = "fg:rosewater"
truncation_symbol = "…/"
truncate_to_repo = false
read_only = "  "

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[cmd_duration]
format = " took [ $duration]($style) "
style = "bold fg:yellow"
min_time = 500

[git_branch]
format = "[$symbol $branch]($style) "
style = "bold fg:rosewater"
symbol = ""

[git_status]
format = '([$all_status$ahead_behind]($style))'
style = "bold fg:green"
up_to_date = "✔"
untracked = "?"
stashed = "≡"
modified = "!"
staged = "+"
renamed = "»"
deleted = "✘"
conflicted = "="
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"

[docker_context]
disabled = true
symbol = " "

[python]
disabled = false
format = "[$symbol$pyenv_prefix($version)( $virtualenv)](fg:peach)"
symbol = " "
version_format = "$raw"

[java]
format = '[[ $symbol ($version) ](fg:red)]($style)'
version_format = "$raw"
symbol = " "
disabled = false

[c]
format = '[[ $symbol ($version) ](fg:blue)]($style)'
symbol = " "
version_format = "$raw"
disabled = false

[zig]
format = '[[ $symbol ($version) ](fg:peach)]($style)'
version_format = "$raw"
disabled = false

[bun]
symbol = "🥟 "
version_format = "$raw"
format = '[[ $symbol ($version) ](fg:text)]($style)'
detect_files = ["bun.lockb", "bun.lock", "bunfig.toml"]
disabled = false

[nodejs]
symbol = ""
format = '[[ $symbol ($version) ](fg:green)]($style)'

[rust]
symbol = ""
format = '[[ $symbol ($version) ](fg:red)]($style)'

[golang]
symbol = ""
format = '[[ $symbol ($version) ](fg:teal)]($style)'

[php]
symbol = ""
format = '[[ $symbol ($version) ](fg:peach)]($style)'

[time]
disabled = false
time_format = "%R"
format = '[[   $time ](fg:subtext0)]($style)'
