- clean: ['~']

- defaults:
    link:
      create: true
      force: true

- create:
    - ~/.hushlogin

- link:
    ~/.config/nvim: editors/nvim
    ~/.config/aerospace/aerospace.toml: editors/aerospace/aerospace.toml
    ~/.config/sketchybar: editors/sketchybar
    ~/.config/tmux: editors/tmux
    ~/.config/herdr/config.toml: editors/herdr/config.toml
    ~/.config/opencode/plugins/tmux-agent-status.ts: editors/opencode/plugins/tmux-agent-status.ts
    ~/.codex/config.toml: editors/codex/config.toml
    ~/.config/lazygit/config.yml: editors/lazygit/config.yml
    ~/.config/starship.toml: shell/starship.toml
    ~/.claude/settings.json: editors/claude/settings.json
    ~/.codex/agent-status-notify.sh: scripts/codex-agent-status.sh
    ~/.pi/agent/extensions/tmux-agent-status.ts: editors/pi/agent/extensions/tmux-agent-status.ts
    ~/.hammerspoon: editors/hammerspoon
    ~/.gitconfig: git/.gitconfig
    ~/Library/Application Support/com.mitchellh.ghostty/config: editors/ghostty/config
    ~/.dotly: os/mac/.dotly
    ~/bin/bash: /opt/homebrew/bin/bash
    ~/bin/date: /opt/homebrew/bin/gdate
    ~/bin/find: /opt/homebrew/bin/gfind
    ~/bin/make: /opt/homebrew/bin/gmake
    ~/bin/sed: /opt/homebrew/bin/gsed
    ~/bin/touch: /opt/homebrew/bin/gtouch
    ~/bin/zsh: /opt/homebrew/bin/zsh
