# Minimal AeroSpace config: safe tiling + SketchyBar workspace numbers.
# Does not require disabling SIP.

start-at-login = true

# Reload SketchyBar after AeroSpace starts so the workspace items can query AeroSpace.
after-startup-command = ['exec-and-forget /bin/bash -lc "sketchybar --reload"']

# Notify SketchyBar when the focused AeroSpace workspace changes.
exec-on-workspace-change = [
  '/bin/bash',
  '-lc',
  'sketchybar --trigger aerospace_workspace_change AEROSPACE_FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE',
]

# Basic layout behavior.
enable-normalization-flatten-containers = false
enable-normalization-opposite-orientation-for-nested-containers = true
accordion-padding = 30

[gaps]
inner.horizontal = 8
inner.vertical = 8
outer.left = 8
outer.bottom = 8
outer.top = 8
outer.right = 8

[workspace-to-monitor-force-assignment]
1 = 1
2 = 1
3 = 1
4 = 1
5 = 2
6 = 2
7 = 2
8 = 2

[mode.main.binding]
# Focus windows.
cmd-alt-h = 'focus left'
cmd-alt-j = 'focus down'
cmd-alt-k = 'focus up'
cmd-alt-l = 'focus right'

# Move windows in the tree.
cmd-alt-shift-h = 'move left'
cmd-alt-shift-j = 'move down'
cmd-alt-shift-k = 'move up'
cmd-alt-shift-l = 'move right'

# Resize is owned by Hammerspoon because layouts are coordinate-based.

# Layout and split controls.
cmd-alt-slash = 'layout tiles horizontal vertical'
cmd-alt-comma = 'layout accordion horizontal vertical'
cmd-alt-f = 'layout floating tiling'
cmd-alt-v = 'split vertical'
cmd-alt-b = 'split horizontal'

# Fullscreen (maximize) focused window within Aerospace.
cmd-alt-ctrl-semicolon = 'fullscreen --no-outer-gaps'

# Monitor focus and window movement.
cmd-alt-tab = 'focus-monitor --wrap-around next'
cmd-alt-shift-tab = 'move-node-to-monitor --wrap-around next --focus-follows-window'

cmd-alt-ctrl-h = 'focus-monitor left'
cmd-alt-ctrl-j = 'focus-monitor down'
cmd-alt-ctrl-k = 'focus-monitor up'
cmd-alt-ctrl-l = 'focus-monitor right'

cmd-alt-ctrl-shift-h = 'move-node-to-monitor left --focus-follows-window'
cmd-alt-ctrl-shift-j = 'move-node-to-monitor down --focus-follows-window'
cmd-alt-ctrl-shift-k = 'move-node-to-monitor up --focus-follows-window'
cmd-alt-ctrl-shift-l = 'move-node-to-monitor right --focus-follows-window'

# Workspaces.
# Monitor 1: 1-4. Monitor 2: 5-8.
cmd-alt-1 = 'workspace 1'
cmd-alt-2 = 'workspace 2'
cmd-alt-3 = 'workspace 3'
cmd-alt-4 = 'workspace 4'
cmd-alt-5 = 'workspace 5'
cmd-alt-6 = 'workspace 6'
cmd-alt-7 = 'workspace 7'
cmd-alt-8 = 'workspace 8'

# Move focused window to workspace.
cmd-alt-shift-1 = 'move-node-to-workspace 1 --focus-follows-window'
cmd-alt-shift-2 = 'move-node-to-workspace 2 --focus-follows-window'
cmd-alt-shift-3 = 'move-node-to-workspace 3 --focus-follows-window'
cmd-alt-shift-4 = 'move-node-to-workspace 4 --focus-follows-window'
cmd-alt-shift-5 = 'move-node-to-workspace 5 --focus-follows-window'
cmd-alt-shift-6 = 'move-node-to-workspace 6 --focus-follows-window'
cmd-alt-shift-7 = 'move-node-to-workspace 7 --focus-follows-window'
cmd-alt-shift-8 = 'move-node-to-workspace 8 --focus-follows-window'

# Maintenance.
cmd-alt-enter = 'exec-and-forget /bin/bash -lc "$HOME/.dotfiles/scripts/wm/layout-columns.sh"'
cmd-alt-c = 'exec-and-forget /bin/bash -lc "$HOME/.dotfiles/scripts/wm/layout-columns.sh"'
cmd-alt-d = 'exec-and-forget /bin/bash -lc "$HOME/.dotfiles/scripts/wm/layout-stack-right.sh"'
cmd-alt-shift-b = 'exec-and-forget /bin/bash -lc "$HOME/.dotfiles/wm/aerospace/toggle-sketchybar-gap.sh"'
cmd-alt-shift-r = 'reload-config'
